name: build apk
on:
  workflow_dispatch:
  schedule:
    - cron: '00 0 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest release info
        id: getLatest
        uses: cardinalby/git-get-release-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          latest: true
      - name: Install dependencies
        run: |
            sudo apt update
            sudo apt install -y jq
      - name: Get latest Ironfox release version
        run: |
          echo "BUILD_VERSION=$(curl -s https://fdroid.ironfoxoss.org/fdroid/repo/index-v1.json | jq -r '.packages."org.ironfoxoss.ironfox"[0].versionName')" >> $GITHUB_ENV
      - name: Check if latest version was already built
        if: ${{ steps.getLatest.outputs.tag_name != '' && steps.getLatest.outputs.tag_name == env.BUILD_VERSION }}
        run: |
          echo latest version already built and released
          exit 1
      - name: Install build dependencies
        run: |
            sudo apt update
            sudo apt install -y wget apktool zipalign apksigner
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Run build script
        run: |
          cd ${{ github.workspace }}
          chmod +x ./build.sh
          ./build.sh
      - name: Setup Signing Keys (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > release-key.jks
            echo "KEYSTORE=${{ github.workspace }}/release-key.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_ALIAS=$KEYSTORE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASS=$KEYSTORE_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "No signing keystore provided; build outputs will be unsigned."
          fi
      - name: Sign APK
        if: env.KEYSTORE != ''
        run: |
          apksigner sign --ks "$KEYSTORE" --ks-pass pass:"$KEYSTORE_PASS" --ks-key-alias "$KEYSTORE_KEY_ALIAS" --key-pass pass:"$KEYSTORE_KEY_PASS" patched_signed.apk
      - name: Get release notes
        run: |
          RELEASE_NOTES=$(curl -s https://gitlab.com/api/v4/projects/ironfox-oss%2FIronFox/releases/v$BUILD_VERSION | jq -r .description | sed '/## Checksums/,/This release was automatically generated/d')
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          files: ${{ github.workspace }}/patched_signed.apk
          body: ${{ env.RELEASE_NOTES }}
